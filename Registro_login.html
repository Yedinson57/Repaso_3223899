<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/estilos/estilos.css">
    <title>Registro</title>
</head>
<body class="fondo">
    <h2 class="ch2">Bienvenido!</h2>
    <div class="container2">
        <div class="cardR">
            <form class="form" action="index.html" autocomplete="on">
                <h2>Formulario de Registro</h2>
                <label >Nombre Completo</label>
                <input type="text" name="Nombre" required>
                <label for="">Tipo de documento</label>
                <select name="" id="">
                    <option value="">T.I</option>
                    <option value="">C.C</option>
                    <option value="">C.E</option>
                </select>
                <label for="">Numero de documento</label>
                <input type="number" required>
                <label for="">Correo electronico</label>
                <input type="email" name="Correo" required>
                <label for="">Numero de Telefono</label>
                <input type="numer" min="7" max="10" required>
                <label for="">Dirección</label>
                <input type="text" name="Dirección" required>
                <label for="">Fecha Nacimiento</label>
                <input type="date" required>
                <label for="">Edad</label>
                <input type="number" min="0" max="150">
                <label for="">Genero</label>
                <input type="radio">M
                <input type="radio">F
                <label for="comentario">Deja tu comentario:</label>
                <textarea id="comentario" name="comentario" rows="4" cols="50" placeholder="Escribe aquí..."></textarea><br>
                <label for="">¿Ya estas registrado?</label>
                <a href="login.html">Inciar Sesión</a>
                
                <button type="submit">Enviar</button>
                </form>
        </div>
    </div>
</body>
</html>
